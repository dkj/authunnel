AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  authunnel test/dev stack using AWS Cognito as the OIDC authorization server.
  An NLB fronts two authunnel-server targets; Cognito (fully managed) is the
  issuer. No identity-provider EC2 instance is deployed.

# ===========================================================================
# READ THIS FIRST - authunnel client flags required for Cognito
# ===========================================================================
# Unlike the Keycloak variant (aws_cf_authunnel_testdev_keycloak.yaml), this
# stack needs two extra client flags (both supported natively; no code change):
#
# 1. AUDIENCE CLAIM -> --oidc-resource
#    authunnel-server validates the standard JWT `aud` claim against
#    --token-audience (internal/tunnelserver: oidc.CheckAudience). Cognito
#    access tokens only carry an `aud` claim when the authorization request
#    includes an RFC 8707 `resource` parameter whose value is a URL; Cognito
#    then sets `aud` to exactly that value. Cognito ignores the Auth0-style
#    `--oidc-audience` parameter, so you must pass the resource identifier via
#    `--oidc-resource` instead (its value must equal ResourceServerIdentifier):
#        authunnel-client ... --oidc-resource <ResourceServerIdentifier>
#    Also request the custom scope so Cognito authorizes the resource server:
#        --oidc-scopes 'openid <ResourceServerIdentifier>/<CustomScopeName>'
#
# 2. CALLBACK URL -> --oidc-redirect-port
#    Cognito only redirects to callback URLs registered exactly, including port.
#    The client defaults to a random loopback port. Run it with a fixed port:
#        authunnel-client ... --oidc-redirect-port <CallbackPort>
#    so the redirect URI matches the CallbackURLs registered below.
#
# Cognito-side requirements for resource binding (already configured below, but
# they are easy to lose in an edit, so they are called out here):
#   a. MANAGED LOGIN. Resource binding is EXCLUSIVE to managed login. The domain
#      sets ManagedLoginVersion: 2; the classic hosted UI (version 1, the
#      default) accepts the `resource` parameter but silently never sets `aud`,
#      so token audience validation fails with a valid-looking login.
#   b. BRANDING. Managed login needs a branding style to render its pages, so a
#      ManagedLoginBranding resource with UseCognitoProvidedValues is included.
#   c. FEATURE PLAN. Resource binding / access-token customization needs the
#      Essentials tier or higher; the pool sets UserPoolTier: ESSENTIALS.
#
# If you want a stack that needs none of this, use the Keycloak variant instead.
# This template shows the fully-managed, server-free authorization server option
# and exactly what client and Cognito configuration it costs.
#
# Trade-off vs Keycloak: nothing to patch, restart, or harden (Cognito is
# managed), but it is a different IdP from Sanger's production Okta and from the
# repo's test realm, so it is less faithful as a "mirrors production" demo.
# ===========================================================================

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instances
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  VpcId:
    Description: VPC to deploy the authunnel test/dev stack into
    Type: AWS::EC2::VPC::Id

  PublicSubnetIds:
    Description: >-
      Public subnet IDs for the internet-facing Network Load Balancer. The NLB
      spans every subnet you list (so list two in different AZs for load-balancer
      AZ coverage), but note both EC2 backends launch in the FIRST subnet listed;
      these test/dev stacks do not spread the backends across AZs. Supply at least
      one subnet.
    Type: List<AWS::EC2::Subnet::Id>

  CertificateArn:
    Description: ACM certificate ARN for the NLB TLS (tunnel) listener. Must be in the same region as this stack and cover the DNS name testers will use.
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$'
    ConstraintDescription: must be a valid ACM certificate ARN.

  CognitoDomainPrefix:
    Description: >-
      Globally-unique prefix for the Cognito hosted-UI domain, i.e.
      https://<prefix>.auth.<region>.amazoncognito.com. Lowercase letters,
      numbers and hyphens; must not start or end with a hyphen; must not
      contain the reserved strings "aws", "amazon", or "cognito" (Cognito
      rejects those and rolls the stack back).
    Type: String
    AllowedPattern: '^(?!.*(?:aws|amazon|cognito))[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    ConstraintDescription: 1-63 chars, lowercase letters/numbers/hyphens, no leading or trailing hyphen, and must not contain "aws", "amazon", or "cognito".

  ResourceServerIdentifier:
    Description: >-
      Cognito resource-server identifier. MUST be an https:// URL: Cognito uses
      it as the resource-binding target and copies it verbatim into the
      access-token `aud` claim, and resource binding only accepts https (a
      non-localhost http:// URL deploys but then fails authentication). This
      same value is passed to authunnel-server as --token-audience.
    Type: String
    Default: https://authunnel.example/api
    AllowedPattern: '^https://.+$'
    ConstraintDescription: must be an https:// URL (Cognito resource binding rejects non-localhost http URLs).

  CustomScopeName:
    Description: Custom OAuth scope name defined on the resource server (requested by the client as "<ResourceServerIdentifier>/<scope>").
    Type: String
    Default: tunnel

  CallbackPort:
    Description: >-
      Fixed loopback TCP port the authunnel client listens on for the OAuth
      callback. Run the client with --oidc-redirect-port set to this value so
      the redirect URI matches the registered callback URL. Must be >= 1024:
      authunnel-client rejects fixed loopback ports below 1024.
    Type: Number
    Default: 8000
    MinValue: 1024
    MaxValue: 65535

  ExtraServerArgs:
    Description: >-
      Extra command-line arguments appended verbatim to authunnel-server on every
      backend instance, e.g. "--expiry-grace 60s --max-connection-duration 8h".
      Leave blank for none.
    Type: String
    Default: ''

Resources:
  # ----------------------------- Cognito -----------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: authunnel
      # Resource binding (the `resource` -> `aud` mechanism this stack relies on)
      # and access-token customization require the Essentials tier or higher.
      UserPoolTier: ESSENTIALS
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UserPoolTags:
        Name: authunnel

  # ManagedLoginVersion 2 selects the new "managed login" experience. Resource
  # binding is EXCLUSIVE to managed login; the classic hosted UI (version 1,
  # the default) accepts the `resource` parameter but never sets the `aud`
  # claim, which silently breaks token audience validation.
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool
      ManagedLoginVersion: 2

  # Managed login (version 2) requires a branding style to exist for the app
  # client, otherwise the hosted pages fail to render. UseCognitoProvidedValues
  # applies Cognito's default styling so no custom design is needed.
  CognitoManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: CognitoUserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoUserPoolClient
      UseCognitoProvidedValues: true

  # Resource server: its Identifier becomes the access-token `aud` value when
  # the client requests the scope below AND sends the matching `resource` param
  # (managed login only — see the domain resource above).
  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: !Ref ResourceServerIdentifier
      Name: authunnel-server
      Scopes:
        - ScopeName: !Ref CustomScopeName
          ScopeDescription: Permission to open an authunnel tunnel

  # Public native client (PKCE, no secret) for the authunnel CLI login flow.
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: authunnel-cli
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - !Sub ${ResourceServerIdentifier}/${CustomScopeName}
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub http://127.0.0.1:${CallbackPort}/callback
        - !Sub http://localhost:${CallbackPort}/callback
      PreventUserExistenceErrors: ENABLED

  # A test user. CloudFormation can create the user but cannot set a permanent
  # password; after stack creation run, for example:
  #   aws cognito-idp admin-set-user-password \
  #     --user-pool-id <UserPoolId> --username dev-user@example.com \
  #     --password '<StrongPassw0rd!>' --permanent
  CognitoTestUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: dev-user@example.com
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: dev-user@example.com
        - Name: email_verified
          Value: 'true'

  # --------------------------- Networking ----------------------------------
  # Security Group for the internet-facing Network Load Balancer.
  AuthunnelLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: allow public TLS access to the authunnel NLB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS/TLS access to the NLB from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
          Description: HTTPS/TLS access to the NLB from anywhere IPv6
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
        - IpProtocol: -1
          CidrIpv6: ::/0
          Description: All outbound traffic IPv6
      Tags:
        - Key: Name
          Value: authunnel-lb-sg

  # Security Group for the EC2 targets. Port 8080 reachable from the NLB only.
  AuthunnelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ssh access and authunnel target access from NLB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access from anywhere
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: ::/0
          Description: SSH access from anywhere IPv6
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AuthunnelLoadBalancerSecurityGroup
          Description: Authunnel target access from the NLB only
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
        - IpProtocol: -1
          CidrIpv6: ::/0
          Description: All outbound traffic IPv6
      Tags:
        - Key: Name
          Value: authunnel-sg

  # Security Group for the isolated backend host. This demonstrates
  # authunnel's actual purpose: a host with no direct network path from
  # anywhere except the authunnel-server nodes. SSH to it only works by
  # tunnelling through authunnel (see IsolatedHostPrivateIp output and the
  # README for the authunnel-client ProxyCommand invocation).
  AuthunnelIsolatedHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH reachable only from the authunnel-server nodes, nothing else in or out
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref AuthunnelSecurityGroup
          Description: SSH access from the authunnel-server nodes only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref AuthunnelSecurityGroup
          Description: >-
            Not actually needed for SSH replies (security groups are
            stateful), kept only so the group has no implicit allow-all
            egress and its only stated peer is the authunnel-server nodes.
      Tags:
        - Key: Name
          Value: authunnel-isolated-host-sg

  # Isolated backend host. Stock AL2023 sshd, no UserData needed. Reachable
  # only via an authunnel tunnel to port 22 on its private IP; there is no
  # other ingress path (see the security group above).
  AuthunnelIsolatedHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      InstanceType: t4g.nano
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref AuthunnelIsolatedHostSecurityGroup
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      Tags:
        - Key: Name
          Value: authunnel-isolated-host

  # EC2 Instance 1 (authunnel-server)
  AuthunnelInstance1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      InstanceType: t4g.nano
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref AuthunnelSecurityGroup
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y wget

          cd /opt
          wget -O authunnel-server-linux-arm64 https://github.com/dkj/authunnel/releases/latest/download/authunnel-server-linux-arm64
          chmod +x /opt/authunnel-server-linux-arm64

          cat > /etc/systemd/system/authunnel-server.service <<EOF
          [Unit]
          Description=Authunnel test/dev server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt
          ExecStart=/opt/authunnel-server-linux-arm64 --log-level debug --plaintext-behind-reverse-proxy --allow-open-egress --no-ip-block --oidc-issuer=https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool} --token-audience=${ResourceServerIdentifier} ${ExtraServerArgs}
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now authunnel-server.service
      Tags:
        - Key: Name
          Value: authunnel-vm

  # EC2 Instance 2 (authunnel-server)
  AuthunnelInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      InstanceType: t4g.nano
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref AuthunnelSecurityGroup
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y wget

          cd /opt
          wget -O authunnel-server-linux-arm64 https://github.com/dkj/authunnel/releases/latest/download/authunnel-server-linux-arm64
          chmod +x /opt/authunnel-server-linux-arm64

          cat > /etc/systemd/system/authunnel-server.service <<EOF
          [Unit]
          Description=Authunnel test/dev server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt
          ExecStart=/opt/authunnel-server-linux-arm64 --log-level debug --plaintext-behind-reverse-proxy --allow-open-egress --no-ip-block --oidc-issuer=https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool} --token-audience=${ResourceServerIdentifier} ${ExtraServerArgs}
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now authunnel-server.service
      Tags:
        - Key: Name
          Value: authunnel-vm

  # Target Group
  AuthunnelTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: instance
      Targets:
        - Id: !Ref AuthunnelInstance1
          Port: 8080
        - Id: !Ref AuthunnelInstance2
          Port: 8080
      HealthCheckProtocol: TCP
      HealthCheckPort: 8080
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: authunnel-tg

  # Network Load Balancer
  AuthunnelNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AuthunnelLoadBalancerSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Name
          Value: authunnel-lb

  # TLS Listener (tunnel)
  TLSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AuthunnelTargetGroup
      LoadBalancerArn: !Ref AuthunnelNetworkLoadBalancer
      Port: 443
      Protocol: TLS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the Network Load Balancer (point your tunnel DNS name here)
    Value: !GetAtt AuthunnelNetworkLoadBalancer.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-LoadBalancerDNS

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  AppClientId:
    Description: Cognito app client ID for the authunnel CLI (public PKCE client)
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-AppClientId

  OidcIssuer:
    Description: OIDC issuer URL (already wired into the server instances as --oidc-issuer)
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
    Export:
      Name: !Sub ${AWS::StackName}-OidcIssuer

  OidcDiscoveryUrl:
    Description: OIDC discovery document for smoke-testing the issuer
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration
    Export:
      Name: !Sub ${AWS::StackName}-OidcDiscoveryUrl

  TokenAudience:
    Description: Value passed to authunnel-server --token-audience (equals the resource-server identifier / the `aud` the client must request via the `resource` param)
    Value: !Ref ResourceServerIdentifier
    Export:
      Name: !Sub ${AWS::StackName}-TokenAudience

  RequestedScope:
    Description: Custom scope the client must request (in addition to openid)
    Value: !Sub ${ResourceServerIdentifier}/${CustomScopeName}
    Export:
      Name: !Sub ${AWS::StackName}-RequestedScope

  HostedUiDomain:
    Description: Cognito hosted-UI / OAuth2 domain
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: !Sub ${AWS::StackName}-HostedUiDomain

  ClientInvocationHint:
    Description: Client flags required for Cognito (resource binding + fixed callback port)
    Value: !Sub --oidc-resource ${ResourceServerIdentifier} --oidc-scopes 'openid ${ResourceServerIdentifier}/${CustomScopeName}' --oidc-redirect-port ${CallbackPort}

  Instance1Id:
    Description: Instance ID of the first authunnel server
    Value: !Ref AuthunnelInstance1
    Export:
      Name: !Sub ${AWS::StackName}-Instance1Id

  Instance2Id:
    Description: Instance ID of the second authunnel server
    Value: !Ref AuthunnelInstance2
    Export:
      Name: !Sub ${AWS::StackName}-Instance2Id

  SecurityGroupId:
    Description: Security Group ID for authunnel instances
    Value: !Ref AuthunnelSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  LoadBalancerSecurityGroupId:
    Description: Security Group ID for the authunnel Network Load Balancer
    Value: !Ref AuthunnelLoadBalancerSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-LoadBalancerSecurityGroupId

  IsolatedHostInstanceId:
    Description: Instance ID of the isolated backend host (reachable only via an authunnel tunnel)
    Value: !Ref AuthunnelIsolatedHost
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostInstanceId

  IsolatedHostPrivateIp:
    Description: >-
      Private IP of the isolated backend host. This is the target for
      authunnel-client, e.g. --proxycommand <this-ip> 22 or an SSH config
      HostName pointing here via ProxyCommand.
    Value: !GetAtt AuthunnelIsolatedHost.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostPrivateIp

  IsolatedHostSecurityGroupId:
    Description: Security Group ID for the isolated backend host
    Value: !Ref AuthunnelIsolatedHostSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostSecurityGroupId

  VpcIdOutput:
    Description: VPC used by the authunnel stack
    Value: !Ref VpcId
    Export:
      Name: !Sub ${AWS::StackName}-VpcId

  PublicSubnetIdsOutput:
    Description: Public subnet IDs used by the authunnel stack
    Value: !Join [",", !Ref PublicSubnetIds]
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnetIds
