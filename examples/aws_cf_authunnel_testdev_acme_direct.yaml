AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Simplest possible authunnel test/dev stack: a single publicly-reachable
  authunnel-server instance terminates TLS itself using ACME (Let's Encrypt),
  with no reverse proxy, load balancer, or ACM certificate involved.

# ===========================================================================
# READ THIS FIRST - manual DNS step, and how this stack differs from the rest
# ===========================================================================
# Every other stack in this directory puts a TLS-terminating load balancer or
# reverse proxy in front of authunnel-server, which needs a pre-issued ACM
# certificate. This stack instead runs authunnel-server with --acme-domain,
# which uses golang.org/x/crypto/acme/autocert to fetch and renew a Let's
# Encrypt certificate directly on the instance via the TLS-ALPN-01 challenge
# (see docs/DEPLOYMENT.md's ACME section). That challenge runs entirely on
# :443, so no port 80 listener or separate HTTP redirect is needed - just a
# single security group rule.
#
# Manual step (DNS): this template does not manage DNS. After the stack
# creates, point DomainName's DNS record at the ElasticIp output (an A record
# for a bare hostname, or CNAME if DomainName is itself an alias target).
# Let's Encrypt validates ownership by connecting to DomainName on :443, so
# the record must resolve before the first client connection - that first
# connection is also what triggers on-demand certificate issuance, so expect
# a multi-second delay on it while autocert completes the ACME handshake.
#
# Let's Encrypt rate limits (currently 5 duplicate certificates per exact
# domain per week) apply here same as any other ACME use - avoid tearing
# this stack down and recreating it against the same DomainName repeatedly
# in a short window. The ACME account key and issued certificate are cached
# under /var/cache/authunnel/acme on the instance's root volume, so they do
# not survive replacing the instance; a plain reboot keeps them.
#
# Because there is no load balancer to spread load across, this stack
# deploys a single authunnel-server instance rather than the two-instance
# pool the other stacks use - if that instance is replaced or rebooted with
# a lost ACME cache, expect a brief re-issuance delay on the next connection.
# This asymmetry (one instance, no pool) is what makes this the minimal
# topology; it is not the pattern to copy for an HA deployment.
# ===========================================================================

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instances
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  VpcId:
    Description: VPC to deploy the authunnel test/dev stack into
    Type: AWS::EC2::VPC::Id

  PublicSubnetIds:
    Description: >-
      Public subnet IDs for the EC2 instances. The authunnel-server and
      isolated-host instances both land in the FIRST subnet listed; this
      test/dev stack does not spread instances across AZs. Supply at least
      one subnet.
    Type: List<AWS::EC2::Subnet::Id>

  DomainName:
    Description: >-
      Public DNS name clients will use to reach the tunnel, and the domain
      authunnel-server requests a Let's Encrypt certificate for (e.g.
      authunnel-test.example.com). You must point this name at the
      ElasticIp output after the stack is created - see the header comment.
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
    ConstraintDescription: must be a bare DNS hostname, no scheme or path.

  OidcIssuer:
    Description: OIDC issuer URL passed to authunnel-server
    Type: String
    Default: https://dkj.uk.auth0.com/

  TokenAudience:
    Description: Token audience passed to authunnel-server
    Type: String
    Default: https://authunnel.nowhere/api

  ExtraServerArgs:
    Description: >-
      Extra command-line arguments appended verbatim to authunnel-server, e.g.
      "--expiry-grace 60s --max-connection-duration 8h". Leave blank for none.
    Type: String
    Default: ''

Resources:
  # Security Group for the authunnel-server instance. Clients connect
  # directly to this security group on 443 - there is no fronting load
  # balancer or reverse proxy for this stack.
  AuthunnelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ssh and direct public HTTPS/TLS access to the authunnel-server instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access from anywhere
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: ::/0
          Description: SSH access from anywhere IPv6
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS/TLS access to authunnel-server from anywhere (also serves the ACME TLS-ALPN-01 challenge)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
          Description: HTTPS/TLS access to authunnel-server from anywhere IPv6
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
        - IpProtocol: -1
          CidrIpv6: ::/0
          Description: All outbound traffic IPv6
      Tags:
        - Key: Name
          Value: authunnel-sg

  # Security Group for the isolated backend host. This demonstrates
  # authunnel's actual purpose: a host with no direct network path from
  # anywhere except the authunnel-server instance. SSH to it only works by
  # tunnelling through authunnel (see IsolatedHostPrivateIp output and the
  # README for the authunnel-client ProxyCommand invocation).
  AuthunnelIsolatedHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH reachable only from the authunnel-server instance, nothing else in or out
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref AuthunnelSecurityGroup
          Description: SSH access from the authunnel-server instance only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref AuthunnelSecurityGroup
          Description: >-
            Not actually needed for SSH replies (security groups are
            stateful), kept only so the group has no implicit allow-all
            egress and its only stated peer is the authunnel-server instance.
      Tags:
        - Key: Name
          Value: authunnel-isolated-host-sg

  # Isolated backend host. Stock AL2023 sshd, no UserData needed. Reachable
  # only via an authunnel tunnel to port 22 on its private IP; there is no
  # other ingress path (see the security group above).
  AuthunnelIsolatedHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      InstanceType: t4g.nano
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: false
          SubnetId: !Select [0, !Ref PublicSubnetIds]
          GroupSet:
            - !Ref AuthunnelIsolatedHostSecurityGroup
      Tags:
        - Key: Name
          Value: authunnel-isolated-host

  # The single authunnel-server instance. Terminates TLS itself via ACME -
  # no reverse proxy, no load balancer.
  AuthunnelInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      InstanceType: t4g.nano
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref AuthunnelSecurityGroup
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y wget

          cd /opt
          wget -O authunnel-server-linux-arm64 https://github.com/dkj/authunnel/releases/latest/download/authunnel-server-linux-arm64
          chmod +x /opt/authunnel-server-linux-arm64

          cat > /etc/systemd/system/authunnel-server.service <<'EOF'
          [Unit]
          Description=Authunnel test/dev server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt
          ExecStart=/opt/authunnel-server-linux-arm64 --log-level debug --acme-domain=${DomainName} --allow-open-egress --no-ip-block --oidc-issuer=${OidcIssuer} --token-audience=${TokenAudience} ${ExtraServerArgs}
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now authunnel-server.service
      Tags:
        - Key: Name
          Value: authunnel-vm

  # Elastic IP so the address DNS points at survives instance stop/start.
  # The ACME cache on the root volume does not survive an instance
  # replacement either way (see header comment), but a stable IP at least
  # means a reboot doesn't require updating DNS again.
  AuthunnelEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: authunnel-eip

  AuthunnelEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AuthunnelEIP.AllocationId
      InstanceId: !Ref AuthunnelInstance

Outputs:
  ElasticIp:
    Description: >-
      Public IP of the authunnel-server instance. Point DomainName's DNS
      record here before connecting a client - see the header comment.
    Value: !Ref AuthunnelEIP
    Export:
      Name: !Sub ${AWS::StackName}-ElasticIp

  TunnelEndpoint:
    Description: Tunnel URL to pass to authunnel-client as --tunnel-url, once DNS is in place
    Value: !Sub https://${DomainName}/protected/tunnel
    Export:
      Name: !Sub ${AWS::StackName}-TunnelEndpoint

  InstanceId:
    Description: Instance ID of the authunnel-server instance
    Value: !Ref AuthunnelInstance
    Export:
      Name: !Sub ${AWS::StackName}-InstanceId

  SecurityGroupId:
    Description: Security Group ID for the authunnel-server instance
    Value: !Ref AuthunnelSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  IsolatedHostInstanceId:
    Description: Instance ID of the isolated backend host (reachable only via an authunnel tunnel)
    Value: !Ref AuthunnelIsolatedHost
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostInstanceId

  IsolatedHostPrivateIp:
    Description: >-
      Private IP of the isolated backend host. This is the target for
      authunnel-client, e.g. --proxycommand <this-ip> 22 or an SSH config
      HostName pointing here via ProxyCommand.
    Value: !GetAtt AuthunnelIsolatedHost.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostPrivateIp

  IsolatedHostSecurityGroupId:
    Description: Security Group ID for the isolated backend host
    Value: !Ref AuthunnelIsolatedHostSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-IsolatedHostSecurityGroupId

  VpcIdOutput:
    Description: VPC used by the authunnel stack
    Value: !Ref VpcId
    Export:
      Name: !Sub ${AWS::StackName}-VpcId

  PublicSubnetIdsOutput:
    Description: Public subnet IDs used by the authunnel stack
    Value: !Join [",", !Ref PublicSubnetIds]
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnetIds
